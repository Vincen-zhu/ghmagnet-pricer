.header{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.header .logo{width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0}
.header .logo img{width:40px;height:40px;object-fit:cover}
.header h1{font-size:18px;color:#1a73e8;text-shadow:0 1px 2px rgba(26,115,232,.15)}
.header .settings-btn{margin-left:auto;width:32px;height:32px;border:none;border-radius:6px;background:#e8e8e8;font-size:16px;cursor:pointer;line-height:32px;text-align:center}
.header .settings-btn:active{background:#ccc}
.sub{font-size:12px;color:#999;margin-bottom:10px;padding-left:2px}
.tab-bar{display:flex;gap:0;margin-bottom:10px;background:rgba(232,232,232,.7);border-radius:10px;overflow:hidden}
.tab{flex:1;text-align:center;padding:8px 0;font-size:13px;cursor:pointer;background:transparent;border:none;font-weight:500}
.tab.active{background:#1a73e8;color:#fff;border-radius:8px}
.card{background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:14px;margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item{display:flex;flex-direction:column;gap:2px}
.item label{font-size:11px;color:#888}
.item input,.item select{height:34px;border:1px solid #ddd;border-radius:6px;padding:0 8px;font-size:13px;background:#fff;width:100%}
.item select{cursor:pointer}
.btn{width:100%;height:40px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff}
.btn-primary:active{background:#0d47a1}
.btn-secondary{background:#e8e8e8;color:#333}
.help{font-size:10px;color:#aaa;margin-top:2px}
.hidden{display:none}
.mt-6{margin-top:6px}
.result{display:none;margin-top:0}
.result.show{display:block}
.summary-row{display:flex;gap:8px;margin-bottom:8px}
.summary-item{flex:1;background:linear-gradient(135deg,#f0f6ff,#e8f0fe);border-radius:10px;padding:10px;text-align:center}
.summary-item .label{font-size:11px;color:#888;margin-bottom:4px}
.summary-item .value{font-size:22px;font-weight:700;color:#1a73e8}
.summary-item .value.price{font-size:26px;color:#c62828}
.summary-item .sub{font-size:11px;color:#999;margin-top:2px}
.detail-box{display:none;margin-top:6px}
.detail-box.show{display:block}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable td{padding:5px 4px;border-bottom:1px solid #eee}
.rtable td:last-child{text-align:right;font-weight:600}
.rtable tr.highlight td{color:#1a73e8;font-size:14px;font-weight:700}
.rtable tr.sub td{color:#666;font-size:11px}
.rtable tr.divider td{border-top:2px dashed #ddd;padding:0;height:0;font-size:0}
.rtable .note{color:#e65100;font-style:italic}
.btn-detail{width:100%;height:36px;border:1px dashed #ccc;border-radius:8px;font-size:13px;cursor:pointer;background:#fafafa;color:#888}
.btn-detail:active{background:#eee}
.grade-g{color:#2e7d32;font-weight:700;font-size:13px}
.grade-m{color:#f57c00;font-weight:700;font-size:13px}
.grade-b{color:#c62828;font-weight:700;font-size:13px}
.rank-box{background:rgba(255,248,225,.92);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:10px;padding:10px;margin-top:8px;font-size:11px;border-left:3px solid #f57c00}
.rank-box .rank-title{color:#e65100;font-size:11px;font-weight:600;margin-bottom:6px}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #f5f0d0}
.rank-item:last-child{border:none}
.rank-item.selected{background:#e3f2fd;margin:0 -8px;padding:3px 8px;border-radius:4px;font-weight:600;border:none}
.rank-item .bar{color:#333}
.rank-item .info{color:#888;font-size:10px}
.rank-item .num{color:#999;font-size:10px;width:18px}

/* Settings overlay */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.overlay.show{display:flex}
.overlay-content{background:rgba(255,255,255,.98);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:16px;width:92%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.overlay-content h2{font-size:15px;margin-bottom:8px}
.overlay-content .close{float:right;font-size:20px;cursor:pointer;color:#999;border:none;background:none;padding:4px}
.price-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}
.price-table th{background:#1a73e8;color:#fff;padding:5px 4px;font-size:11px;text-align:center}
.price-table td{padding:3px 4px;border-bottom:1px solid #eee;text-align:center}
.price-table td:first-child{text-align:left;font-weight:600}
.price-table input{width:60px;height:28px;border:1px solid #ddd;border-radius:4px;text-align:center;font-size:12px;padding:0 2px}
.pass-box{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.pass-box input{flex:1;height:34px;border:1px solid #ddd;border-radius:6px;padding:0 8px;font-size:13px}
.pass-box .btn{width:auto;padding:0 16px;height:34px;font-size:12px}
.price-group{margin-bottom:8px}
.price-group h3{font-size:12px;color:#888;margin-bottom:4px}
</style>

<script>
var DEFAULT_CP={
  'D12+':{'N25':[149,140],'N28':[169,159],'N30':[170,160],'N33':[196,184],'N35-1':[201,189],'N35':[203,191],'N38':[212,199],'N40':[229,215],'N42':[237,223],'N45':[250,235],'N48':[278,261],'N50':[306,287],'N52':[320,300]},
  'D10-D11':{'N25':[151,142],'N28':[171,161],'N30':[173,162],'N33':[198,186],'N35-1':[206,193],'N35':[208,195],'N38':[216,203],'N40':[234,220],'N42':[244,223],'N45':[257,241],'N48':[286,268],'N50':[315,295],'N52':[329,308]},
  'D8':{'N25':[157,147],'N28':[177,166],'N30':[178,167],'N33':[202,190],'N35-1':[211,198],'N35':[213,200],'N38':[220,207],'N40':[240,225],'N42':[249,234],'N45':[262,246],'N48':[291,273],'N50':[321,301],'N52':[335,314]},
  'D3':{'N25':[200,188],'N28':[215,202],'N30':[229,215],'N33':[268,252],'N35':[293,275],'N38':[320,300],'N40':[326,306],'N42':[332,312],'N45':[383,360],'N48':[426,400],'N50':[469,440],'N52':[490,460]}
};
var DEFAULT_SQ={'N25':[121,114],'N28':[133,125],'N30':[142,133],'N33-1':[169,159],'N33':[173,162],'N35':[181,170],'N38':[199,187],'N40':[204,192],'N42':[212,199],'N45':[251,236],'N48':[265,249],'N50':[288,270],'N52':[314,295]};

/* 剩磁 Br (Tesla) - 材料标准值 (GB/T 13560) */
var BR_T={'N25':1.10,'N28':1.14,'N30':1.15,'N33':1.19,'N35-1':1.20,'N35':1.21,'N38':1.25,'N40':1.27,'N42':1.32,'N45':1.37,'N48':1.41,'N50':1.44,'N52':1.47};
/* 用户手动输入的实测表磁 {牌号+'x'+直径+'x'+厚度: Gs值} */
var GS_OVERRIDE={};
function calcGs(grade,shape,args){
  var data=loadPriceData();var brT=BR_T[grade];
  if(!brT)return null;
  var key=grade;
  if(shape==='circle'){var d=args[0],t=args[1];key+='x'+d+'x'+t}
  else if(shape==='square'){var l=args[0],w=args[1],h=args[2];key+='x'+l+'x'+w+'x'+h}
  if(data.GS_OVERRIDE&&data.GS_OVERRIDE[key]!==undefined)return data.GS_OVERRIDE[key];
  var brGs=brT*10000;
  if(shape==='circle'){
    var d=args[0],t=args[1];
    if(d<=0||t<=0)return Math.round(brGs*0.5);
    var r=d/2;
    // 中心点表磁公式 (无修正)
    return Math.round(brGs/2*(t/Math.sqrt(r*r+t*t)))
  } else if(shape==='square'){
    var l=args[0],w=args[1],h=args[2];
    if(l<=0||w<=0||h<=0)return Math.round(brGs*0.3);
    var effR=Math.min(l,w)/2;
    return Math.round(brGs/2*(h/Math.sqrt(effR*effR+h*h)))
  }
  return Math.round(brGs*0.5)
}
function getGs(g){return BR_T[g]?Math.round(BR_T[g]*10000):null}
function calcPullForce(weightG,grade){
  // 行业通用: 重量(g) × 600~640倍 = 吸力(g)
  // N35约600倍, N52约640倍, 中间按牌号比例插值
  if(!weightG||weightG<=0)return null;
  var brT=BR_T[grade]||1.21;
  var factor=600+(brT-1.21)/(1.47-1.21)*40; // 1.21(N35)=600, 1.47(N52)=640
  factor=Math.round(factor);
  var forceKg=weightG*factor/1000;
  return Math.round(forceKg*10)/10
}

function loadPriceData(){
  var data = localStorage.getItem('ghmagnet_prices');
  if(data){
    try{var d=JSON.parse(data);if(d.CP&&d.SQ) return d}catch(e){}
  }
  return {CP:JSON.parse(JSON.stringify(DEFAULT_CP)),SQ:JSON.parse(JSON.stringify(DEFAULT_SQ))}
}

/* Lookup price: checks override first, then table */
function getCP(d,g,tx){
  var ov = document.getElementById('cPrice');
  if(ov && ov.value.trim()!=='') return +ov.value;
  var CP = loadPriceData().CP;
  var gr;if(d>=12)gr='D12+';else if(d>=10)gr='D10-D11';else if(d>=8)gr='D8';else if(d>=3)gr='D3';else return null;
  var p=CP[gr];return p&&p[g]?tx?p[g][0]:p[g][1]:null
}
function getSQ(g,tx){
  var ov = document.getElementById('sPrice');
  if(ov && ov.value.trim()!=='') return +ov.value;
  var SQ = loadPriceData().SQ;
  return SQ[g]?tx?SQ[g][0]:SQ[g][1]:null
}

var BL=[32,34,35,36,36.5,37,39,40,42,47],DEN=7.6,FC=1.5,CK=0.18,SK=0.18,FAC=1.1,LS=1.03,TXR=1.1,PC={'锌':6,'镍':15};
var RB_TX=0.038,RB_YX=0.057,RB_TAPE_M2=40;
var SET_PASS='GH88888888';

function fn(n,d){return n!==undefined&&n!==null?Number(n).toFixed(d):'-'}
function switchTab(n){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('#tab-circle,#tab-square,#tab-rubber').forEach(function(t){t.style.display='none'});
  var idx=n==='circle'?0:n==='square'?1:2;
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('tab-'+n).style.display='block'
}
function toggleDrill(){var v=document.getElementById('drillMode').value;document.getElementById('drillHoleRow').classList.toggle('hidden',v==='none');document.getElementById('coreHint').classList.toggle('hidden',v!=='core')}
function toggleSDrill(){var v=document.getElementById('sdrillMode').value;document.getElementById('sdrillHoleRow').classList.toggle('hidden',v==='none');document.getElementById('scoreHint').classList.toggle('hidden',v!=='core')}
function toggleDetail(s){var d=document.getElementById(s+'-detail');d.classList.toggle('show');var b=d.parentElement.querySelector('.btn-detail');b.textContent=d.classList.contains('show')?'&#x1f53d; 收起详细计算':'&#x1f4cb; 查看详细计算'}
function fill(t,rows){t.innerHTML='';rows.forEach(function(r){var tr=document.createElement('tr');if(r[2])tr.className=r[2];if(r[0]==='-'){tr.innerHTML='<td colspan="2"></td>';tr.className='divider'}else{tr.innerHTML='<td>'+r[0]+'</td><td>'+r[1]+'</td>'}t.appendChild(tr)})}
function gradeWaste(pct){if(pct<=5)return{html:'<span class="grade-g">优</span>',text:'优'};if(pct<=15)return{html:'<span class="grade-m">中</span>',text:'中'};return{html:'<span class="grade-b">差</span>',text:'差'}}
function rankBars(t){return BL.map(function(bl){var sl=Math.floor((bl-FC)/(t+CK));if(sl<=0)return null;var used=FC+sl*(t+CK),waste=bl-used,wastePct=waste/bl*100;return{bl:bl,sl:sl,waste:waste,wastePct:wastePct}}).filter(function(x){return x!==null}).sort(function(a,b){return a.wastePct-b.wastePct})}
function findBest(t){var b=null,bw=Infinity;for(var i=0;i<BL.length;i++){var L=BL[i],u=L-FC,tot=t+CK,c=Math.floor(u/tot);if(c>0){var u2=FC+c*tot,w=L-u2;if(w<bw){bw=w;b=L}}}return b}

function calcDrill(mode,holeD,barLen,slices,matPrice){
  if(mode==='none')return{cost:0,rows:[]};
  if(mode==='straight'){var ps=0.3/slices;return{cost:ps,rows:[['直孔费','0.3元/根 -> '+fn(ps,6)+'元/片']]}}
  if(mode==='core'){var cd=holeD-2,cw=3.14159*(cd/2/10)*(cd/2/10)*(barLen/10)*DEN/1e3,cv=cw*matPrice*0.8,net=0.3-cv,ps=net/slices;return{cost:ps,rows:[['套孔费','0.3元/根'],['柱芯 '+fn(cd,1)+'X'+fn(barLen,1)+'mm',fn(cw,6)+'kg/根','sub'],['回收价',fn(cv,6)+'元/根','sub'],['抵扣','-'+fn(cv,6)+'元/根','sub'],[ps<0?'实付(净赚)':'实付',(ps<0?'-'+fn(Math.abs(ps),6):fn(ps,6))+'元/片','sub']]}}
  if(mode==='csink'){var sp=0.3/slices;return{cost:sp+0.05,rows:[['直孔费','0.3元/根->'+fn(sp,6)+'元/片'],['沉孔费','0.05元/片'],['合计',fn(sp+0.05,6)+'元/片']]}
}
}

function calcSDrill(mode,holeD,perHgt,matRate,blockH,blockL){
  if(mode==='none')return{cost:0,rows:[]};
  if(mode==='straight'){var ps=0.3/perHgt;return{cost:ps,rows:[['直孔费','0.3元/块->'+fn(ps,6)+'元/片']]}}
  if(mode==='core'){var cd=holeD-1,cw=(cd/10)*(cd/10)*(blockL/10)*DEN/1e3,cv=cw*matRate*0.8,net=0.3-cv,ps=net/perHgt;return{cost:ps,rows:[['套孔费','0.3元/块'],['柱芯'+cd+'X'+cd+'X'+fn(blockL,1)+'mm',fn(cw,6)+'kg/块','sub'],['回收价',fn(cv,6)+'元/块','sub'],['抵扣','-'+fn(cv,6)+'元/块','sub'],[ps<0?'实付(净赚)':'实付',(ps<0?'-'+fn(Math.abs(ps),6):fn(ps,6))+'元/片','sub']]}}
  if(mode==='csink'){var sp=0.3/perHgt;return{cost:sp+0.05,rows:[['直孔费','0.3元/块->'+fn(sp,6)+'元/片'],['沉孔费','0.05元/片'],['合计',fn(sp+0.05,6)+'元/片']]}
}
}

function calcCircle(){
  var d=+document.getElementById('d').value,t=+document.getElementById('t').value;
  var g=document.getElementById('grade').value,pl=document.getElementById('plating').value;
  var q=+document.getElementById('qty').value||1,tx=document.getElementById('tax').value==='1';
  var bi=document.getElementById('bar').value.trim(),bl=bi?+bi:findBest(t);
  var dm=document.getElementById('drillMode').value,dh=+document.getElementById('drillHole').value||0;
  var ovEl=document.getElementById('cGs');var override=document.getElementById('cPrice').value.trim();
  var mp=getCP(d,g,tx);
  if(mp===null||mp===undefined){alert('无此牌号默认价格\n请在"临时改价"栏手动输入单价');return}
  var w=3.14159*(d/2/10)*(d/2/10)*(t/10)*DEN,sl=Math.floor((bl-FC)/(t+CK));
  if(sl<=0){alert('切不出');return}
  var bw=3.14159*(d/2/10)*(d/2/10)*(bl/10)*DEN/1e3,mc=bw*mp/sl,pf=0.002355*d/5;
  var pc=w/1e3*(PC[pl]||0),dc=calcDrill(dm,dh,bl,sl,mp);
  var va=mc+pf+pc+dc.cost,se=va*LS*FAC,ts=se*TXR,to=(tx?ts:se)*q,bn=Math.ceil(q/sl);
  var used=FC+sl*(t+CK),waste=bl-used,pct=waste/bl*100,gr=gradeWaste(pct);
  
  document.getElementById('circle-result').classList.add('show');
  document.getElementById('barRecommend').textContent='\u2714 推荐 '+fn(bl,1)+'mm -> '+sl+'片  废'+fn(waste,1)+'mm ('+fn(pct,1)+'%) '+gr.text;
  
  var sm=document.getElementById('circle-summary');
  var gsCls=(ovEl&&ovEl.value.trim()!==''?'gs-green':'gs-red');var gs=calcGs(g,'circle',[d,t]);var pf=calcPullForce(w,g);sm.innerHTML='<div class="summary-item"><div class="label">'+((ovEl&&ovEl.value.trim()!=='')?'&#x2705; 实测':'&#x2728; 公式')+'表磁</div><div class="value '+gsCls+'">'+(gs?gs.toLocaleString():'?')+'<span style="font-size:9px;font-weight:400;color:#888"> Gs</span></div></div><div class="summary-item"><div class="label">&#x2696; 单重</div><div class="value">'+fn(w,4)+'<span style="font-size:9px;color:#888;font-weight:400"> g</span></div></div><div class="summary-item"><div class="label">&#x1f9f0; 吸力</div><div class="value" style="font-size:22px;font-weight:700;color:#e67e22">'+(pf?pf.toLocaleString():'?')+'<span style="font-size:9px;color:#888;font-weight:400"> kg</span></div></div><div class="summary-item"><div class="label">&#x1f4b0; '+(tx?'含税':'不含税')+'价</div><div class="value price">'+fn(se,6)+'<span style="font-size:9px;color:#888;font-weight:400"> 元</span></div><div class="sub">'+(q>1?'<b>'+fn(to,2)+'</b>元 / ':'')+''+(gs?((ovEl&&ovEl.value.trim()!=='')?'实测':'公式'):'')+'</div></div>';

  var p=document.getElementById('setPass').value.trim();

  var grades=Object.keys(data.SQ);
  for(var i=0;i<grades.length;i++){var g=grades[i];h+='<tr><td>'+g+'</td><td><input type="number" id="sq_'+g+'_tx" value="'+data.SQ[g][0]+'" step="1"></td><td><input type="number" id="sq_'+g+'_ntx" value="'+data.SQ[g][1]+'" step="1"></td></tr>'}

    h+='</table></div>'}

function savePrices(){
  var data=loadPriceData();

  var grades=Object.keys(data.SQ);

  var grps=['D3','D8','D10-D11','D12+'];
  for(var gi=0;gi<grps.length;gi++){var grp=grps[gi];var cpg=data.CP[grp];if(cpg){var grades2=Object.keys(cpg);
    for(var i=0;i<grades2.length;i++){var g=grades2[i];var tx=document.getElementById('cp_'+grp+'_'+g+'_tx'),ntx=document.getElementById('cp_'+grp+'_'+g+'_ntx');if(tx&&ntx){cpg[g][0]=+tx.value;cpg[g][1]=+ntx.value}}}}

}
function loadDefaultPrices(){
  localStorage.removeItem('ghmagnet_prices');
