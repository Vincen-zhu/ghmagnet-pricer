<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户管理系统 - 广宏磁铁</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AiPexBase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/aipexbase-js/dist/aipexbase.umd.min.js"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }
                },
                animation: { 'fade-in':'fadeIn 0.3s ease-out','slide-up':'slideUp 0.3s ease-out','slide-down':'slideDown 0.25s ease-out','scale-in':'scaleIn 0.2s ease-out' },
                keyframes: {
                    fadeIn:{'0%':{opacity:'0'},'100%':{opacity:'1'}},
                    slideUp:{'0%':{opacity:'0',transform:'translateY(16px)'},'100%':{opacity:'1',transform:'translateY(0)'}},
                    slideDown:{'0%':{opacity:'0',transform:'translateY(-12px)'},'100%':{opacity:'1',transform:'translateY(0)'}},
                    scaleIn:{'0%':{opacity:'0',transform:'scale(0.95)'},'100%':{opacity:'1',transform:'scale(1)'}}
                },
                boxShadow: { soft:'0 2px 15px -3px rgba(0,0,0,0.07),0 10px 20px -2px rgba(0,0,0,0.04)', 'soft-lg':'0 10px 40px -10px rgba(0,0,0,0.1),0 2px 10px -2px rgba(0,0,0,0.04)' }
            }
        }
    }
    </script>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f8fafc; min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226,232,240,0.6); }
    .card-hover { transition: all 0.25s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -8px rgba(0,0,0,0.08); }
    .tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; }
    .tag-blue { background: #eef2ff; color: #4338ca; }
    .tag-green { background: #ecfdf5; color: #059669; }
    .tag-amber { background: #fffbeb; color: #d97706; }
    .tag-purple { background: #f5f3ff; color: #7c3aed; }
    .tag-gray { background: #f1f5f9; color: #475569; }
    .tag-rose { background: #fff1f2; color: #e11d48; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; height: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .modal-overlay { background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); }
    input, select, textarea { transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.35); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary { display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; background: #fff; color: #475569; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-danger { display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; background: #fff; color: #e11d48; border: 1px solid #fecdd3; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-danger:hover { background: #fff1f2; border-color: #fda4af; }
    .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .chip-indigo { background: #eef2ff; color: #4338ca; }
    .chip-emerald { background: #ecfdf5; color: #059669; }
    .chip-sky { background: #f0f9ff; color: #0369a1; }
    .chip-orange { background: #fff7ed; color: #c2410c; }
    .chip-gray { background: #f1f5f9; color: #475569; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state svg { margin: 0 auto 16px; color: #94a3b8; }
    .empty-state p { color: #94a3b8; font-size: 15px; }
    @media (max-width: 640px) { .mobile-full { padding: 12px; } }
    </style>
</head>
<body>

<!-- ====== Toast ====== -->
<div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-3 pointer-events-none"></div>

<!-- ====== Navbar ====== -->
<nav class="glass sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <span class="text-white font-bold text-sm">GH</span>
            </div>
            <div>
                <span class="text-lg font-bold text-gray-800">客户管理</span>
                <span class="text-xs text-gray-400 ml-2">广宏磁铁</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openCustomerModal()" class="btn-primary">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                新增客户
            </button>
        </div>
    </div>
</nav>

<!-- ====== Search Bar ====== -->
<div class="max-w-6xl mx-auto px-4 pt-5 pb-2">
    <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" placeholder="搜索客户名称、电话、地址或产品规格..." oninput="renderCustomerList()"
            class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm text-gray-700 placeholder-gray-400 shadow-sm">
    </div>
    <div class="flex items-center gap-2 mt-2 text-xs text-gray-400">
        <span>共 <span id="totalCount">0</span> 个客户</span>
        <span class="w-1 h-1 rounded-full bg-gray-300"></span>
        <span id="statsInfo"></span>
    </div>
</div>

<!-- ====== Main Content ====== -->
<main class="max-w-6xl mx-auto px-4 pb-20 animate-fade-in">
    <div id="customerList" class="space-y-3 mt-1"></div>
    <div id="emptyState" class="empty-state hidden">
        <svg class="w-16 h-16 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <p class="text-gray-400 text-base">还没有客户数据</p>
        <button onclick="openCustomerModal()" class="btn-primary mt-4">添加第一个客户</button>
    </div>
</main>

<!-- ====== Customer Modal ====== -->
<div id="customerModal" class="fixed inset-0 z-[60] hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeCustomerModal()"></div>
    <div class="absolute inset-0 flex items-start justify-center pt-12 px-4 pb-8 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg animate-scale-in overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-800" id="customerModalTitle">新增客户</h3>
                <button onclick="closeCustomerModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">客户名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="custName" placeholder="输入客户名称" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
                    <input type="text" id="custPhone" placeholder="输入电话" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">地址</label>
                    <input type="text" id="custAddress" placeholder="输入地址" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-100">
                <button onclick="closeCustomerModal()" class="btn-secondary">取消</button>
                <button onclick="saveCustomer()" class="btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== Product Modal ====== -->
<div id="productModal" class="fixed inset-0 z-[70] hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeProductModal()"></div>
    <div class="absolute inset-0 flex items-start justify-center pt-12 px-4 pb-8 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl animate-scale-in overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-800">
                    <span id="prodModalTitle">新增产品</span>
                    <span id="prodModalCust" class="text-sm font-normal text-gray-400 ml-2"></span>
                </h3>
                <button onclick="closeProductModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto scrollbar-thin">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">产品规格 <span class="text-red-500">*</span></label>
                        <input type="text" id="prodSpec" placeholder="如 D10x6mm" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">单价（未税）<span class="text-red-500">*</span></label>
                        <input type="number" id="prodPrice" placeholder="0.00" step="0.01" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">我方性能 <span class="text-red-500">*</span></label>
                        <select id="prodOurPerf" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
                            <option value="">请选择</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">客户性能</label>
                        <select id="prodCustPerf" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
                            <option value="">无</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">耐温等级</label>
                        <select id="prodTemp" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
                            <option value="">不指定</option>
                            <option value="80°C">80°C</option>
                            <option value="100°C">100°C</option>
                            <option value="120°C">120°C</option>
                            <option value="150°C">150°C</option>
                            <option value="180°C">180°C</option>
                            <option value="200°C">200°C</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">电镀</label>
                        <select id="prodPlating" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
                            <option value="">不指定</option>
                            <option value="镀锌">镀锌</option>
                            <option value="镀镍">镀镍</option>
                            <option value="镀锌盐雾24小时">镀锌盐雾24小时</option>
                            <option value="镀镍盐雾24小时">镀镍盐雾24小时</option>
                            <option value="盐雾48小时">盐雾48小时</option>
                            <option value="环氧树脂">环氧树脂</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">客户编码（选填，留空自动生成）</label>
                    <input type="text" id="prodCode" placeholder="客户自己的编码" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                    <textarea id="prodRemarks" rows="2" placeholder="补充信息..." class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm resize-none"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-100">
                <button onclick="closeProductModal()" class="btn-secondary">取消</button>
                <button onclick="saveProduct()" class="btn-primary">保存产品</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== Confirm Dialog ====== -->
<div id="confirmModal" class="fixed inset-0 z-[80] hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeConfirm()"></div>
    <div class="absolute inset-0 flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm animate-scale-in p-6">
            <div class="text-center">
                <div class="mx-auto w-12 h-12 rounded-full bg-red-50 flex items-center justify-center mb-3">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>
                <p class="text-gray-700 font-medium" id="confirmMsg">确定要删除吗？</p>
                <p class="text-gray-400 text-sm mt-1" id="confirmSub"></p>
            </div>
            <div class="flex gap-3 mt-5">
                <button onclick="closeConfirm()" class="btn-secondary flex-1">取消</button>
                <button id="confirmBtn" class="flex-1 btn-primary bg-gradient-to-r from-red-500 to-red-600 hover:shadow-red-500/30" style="background:linear-gradient(135deg,#ef4444,#dc2626)">删除</button>
            </div>
        </div>
    </div>
</div>

<script>
// ====== Init ======
const client = aipexbase.createClient({
    baseUrl: 'https://baas.kuafuai.net/baas-api',
    apiKey: 'baas_JhYmjHav'
});

// ====== Performance grade options ======
const gradeOptions = [
    'N25','N28','N30','N33','N35','N38','N40','N42','N45','N48','N50','N52',
    'N35M','N38M','N40M','N42M','N45M','N48M','N50M',
    'N30H','N33H','N35H','N38H','N40H','N42H','N45H','N48H',
    'N30SH','N33SH','N35SH','N38SH','N40SH','N42SH','N45SH',
    'N28UH','N30UH','N33UH','N35UH','N38UH','N40UH','N42UH',
    'N28EH','N30EH','N33EH','N35EH','N38EH','N40EH'
];

// ====== State ======
let customers = [];
let editingCustomerId = null;
let editingProductId = null;
let currentProductCustId = null;
let confirmCallback = null;

// ====== Toast ======
function showToast(msg, type='success') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    const colors = {success:'bg-green-50 border-green-200 text-green-700',error:'bg-red-50 border-red-200 text-red-700',info:'bg-blue-50 border-blue-200 text-blue-700'};
    const icons = {success:'<path d="M5 13l4 4L19 7"/>',error:'<path d="M6 18L18 6M6 6l12 12"/>',info:'<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'};
    t.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg animate-slide-down ${colors[type]||colors.info}`;
    t.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${icons[type]||icons.info}</svg><span class="text-sm font-medium">${msg}</span>`;
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all 0.3s';setTimeout(()=>t.remove(),300)},3000);
}

// ====== Load data ======
async function loadCustomers() {
    try {
        const res = await client.db.from('customers').list().order('id','desc');
        if (res.success) customers = res.data || [];
        else customers = [];
    } catch(e) { customers = []; }
    renderCustomerList();
}

// ====== Render ======
function renderCustomerList() {
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    let filtered = customers;
    if (q) {
        filtered = customers.filter(c => {
            const matchCust = (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.address||'').toLowerCase().includes(q);
            if (matchCust) return true;
            if (c.products && c.products.length) {
                return c.products.some(p => (p.specification||'').toLowerCase().includes(q) || (p.product_code||'').toLowerCase().includes(q));
            }
            return false;
        });
    }

    document.getElementById('totalCount').textContent = customers.length;
    const container = document.getElementById('customerList');
    const empty = document.getElementById('emptyState');

    if (!filtered.length) {
        container.innerHTML = '';
        if (!customers.length) { empty.classList.remove('hidden'); }
        else {
            empty.classList.add('hidden');
            container.innerHTML = `<div class="text-center py-16 text-gray-400 text-sm">没有匹配的客户</div>`;
        }
        return;
    }
    empty.classList.add('hidden');

    let html = '';
    filtered.forEach((c, idx) => {
        const prods = c.products || [];
        const prodCount = prods.length;
        html += `
        <div class="bg-white rounded-2xl shadow-soft border border-gray-100 overflow-hidden card-hover animate-fade-in" style="animation-delay:${idx*30}ms">
            <div class="px-5 py-4 flex items-center justify-between cursor-pointer" onclick="toggleExpand('cust_${c.id}')">
                <div class="flex items-center gap-3 min-w-0 flex-1">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-50 to-brand-100 flex items-center justify-center flex-shrink-0">
                        <span class="text-brand-600 font-bold text-sm">${(c.name||'?')[0]}</span>
                    </div>
                    <div class="min-w-0">
                        <div class="font-semibold text-gray-800 text-[15px] truncate">${escHtml(c.name)}</div>
                        <div class="flex items-center gap-3 mt-0.5 text-xs text-gray-400">
                            ${c.phone ? `<span>${escHtml(c.phone)}</span>` : ''}
                            ${c.phone && c.address ? '<span class="w-1 h-1 rounded-full bg-gray-300"></span>' : ''}
                            ${c.address ? `<span class="truncate">${escHtml(c.address)}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-shrink-0">
                    <span class="tag ${prodCount>0?'tag-blue':'tag-gray'}">${prodCount} 个产品</span>
                    <div class="flex gap-1" onclick="event.stopPropagation()">
                        <button onclick="openProductModal(${c.id})" class="w-8 h-8 rounded-lg hover:bg-brand-50 flex items-center justify-center text-brand-500 transition-colors" title="添加产品">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                        </button>
                        <button onclick="openCustomerModal(${c.id})" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 transition-colors" title="编辑">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="confirmDelete('customer',${c.id},'${escHtml(c.name)}')" class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors" title="删除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 transition-transform" id="arrow_cust_${c.id}">
                        <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div id="body_cust_${c.id}" class="hidden border-t border-gray-50">
                ${prods.length ? renderProducts(c.id, prods) : `<div class="px-5 py-6 text-center text-sm text-gray-400">暂无产品，<button onclick="openProductModal(${c.id})" class="text-brand-500 font-medium hover:underline">添加产品</button></div>`}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

function renderProducts(custId, products) {
    let html = `<div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wider">
            <th class="text-left px-4 py-3 font-medium">编码</th>
            <th class="text-left px-4 py-3 font-medium">规格</th>
            <th class="text-right px-4 py-3 font-medium">单价</th>
            <th class="text-center px-4 py-3 font-medium">我方性能</th>
            <th class="text-center px-4 py-3 font-medium">客户性能</th>
            <th class="text-center px-4 py-3 font-medium">耐温</th>
            <th class="text-center px-4 py-3 font-medium">电镀</th>
            <th class="text-center px-4 py-3 font-medium w-20">操作</th>
        </tr></thead><tbody>`;
    products.forEach((p, i) => {
        html += `<tr class="border-t border-gray-50 hover:bg-gray-50/50 transition-colors ${i%2===0?'bg-white':'bg-gray-50/30'}">
            <td class="px-4 py-3 text-gray-600 text-xs font-mono">${escHtml(p.product_code||'-')}</td>
            <td class="px-4 py-3 font-medium text-gray-800">${escHtml(p.specification)}</td>
            <td class="px-4 py-3 text-right font-mono text-gray-700">¥${Number(p.unit_price||0).toFixed(2)}</td>
            <td class="px-4 py-3 text-center">${renderChip(p.our_performance,'indigo')}</td>
            <td class="px-4 py-3 text-center">${p.customer_performance ? renderChip(p.customer_performance,'emerald') : '<span class="text-gray-300">-</span>'}</td>
            <td class="px-4 py-3 text-center">${p.temperature_rating ? renderChip(p.temperature_rating,'orange') : '<span class="text-gray-300">-</span>'}</td>
            <td class="px-4 py-3 text-center">${p.plating ? renderChip(p.plating,'sky') : '<span class="text-gray-300">-</span>'}</td>
            <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1">
                    <button onclick="event.stopPropagation();openProductModal(${custId},${p.id})" class="w-7 h-7 rounded hover:bg-gray-100 flex items-center justify-center text-gray-400" title="编辑">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button onclick="event.stopPropagation();confirmDelete('product',${p.id},'${escHtml(p.specification)}')" class="w-7 h-7 rounded hover:bg-red-50 flex items-center justify-center text-gray-400 hover:text-red-500" title="删除">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </td>
        </tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
}

function renderChip(val, color) {
    const map = {indigo:'chip-indigo',emerald:'chip-emerald',orange:'chip-orange',sky:'chip-sky',gray:'chip-gray'};
    return `<span class="chip ${map[color]||'chip-gray'}">${escHtml(val)}</span>`;
}

function escHtml(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ====== Toggle expand ======
function toggleExpand(id) {
    const body = document.getElementById('body_'+id);
    const arrow = document.getElementById('arrow_'+id);
    if (!body) return;
    body.classList.toggle('hidden');
    if (arrow) arrow.style.transform = body.classList.contains('hidden') ? '' : 'rotate(180deg)';
}

// ====== Customer Modal ======
async function openCustomerModal(id) {
    editingCustomerId = id || null;
    document.getElementById('customerModalTitle').textContent = id ? '编辑客户' : '新增客户';
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custAddress').value = '';
    if (id) {
        const cust = customers.find(c => c.id === id);
        if (cust) {
            document.getElementById('custName').value = cust.name || '';
            document.getElementById('custPhone').value = cust.phone || '';
            document.getElementById('custAddress').value = cust.address || '';
        }
    }
    document.getElementById('customerModal').classList.remove('hidden');
}
function closeCustomerModal() {
    document.getElementById('customerModal').classList.add('hidden');
    editingCustomerId = null;
}
async function saveCustomer() {
    const name = document.getElementById('custName').value.trim();
    if (!name) { showToast('请填写客户名称', 'error'); return; }
    const phone = document.getElementById('custPhone').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    try {
        if (editingCustomerId) {
            await client.db.from('customers').update()
                .set({ name, phone, address })
                .eq('id', editingCustomerId);
            showToast('客户已更新 ✅');
        } else {
            await client.db.from('customers').insert()
                .values({ name, phone, address });
            showToast('客户已添加 ✅');
        }
        closeCustomerModal();
        await loadCustomers();
    } catch(e) { showToast('保存失败: '+e.message, 'error'); }
}

// ====== Product Modal ======
async function openProductModal(custId, prodId) {
    currentProductCustId = custId;
    editingProductId = prodId || null;
    const cust = customers.find(c => c.id === custId);
    document.getElementById('prodModalCust').textContent = cust ? '→ '+cust.name : '';
    document.getElementById('prodModalTitle').textContent = prodId ? '编辑产品' : '新增产品';

    // Reset form
    document.getElementById('prodSpec').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodOurPerf').value = '';
    document.getElementById('prodCustPerf').value = '';
    document.getElementById('prodTemp').value = '';
    document.getElementById('prodPlating').value = '';
    document.getElementById('prodCode').value = '';
    document.getElementById('prodRemarks').value = '';

    if (prodId) {
        const products = cust ? cust.products || [] : [];
        const prod = products.find(p => p.id === prodId);
        if (prod) {
            document.getElementById('prodSpec').value = prod.specification || '';
            document.getElementById('prodPrice').value = prod.unit_price || '';
            document.getElementById('prodOurPerf').value = prod.our_performance || '';
            document.getElementById('prodCustPerf').value = prod.customer_performance || '';
            document.getElementById('prodTemp').value = prod.temperature_rating || '';
            document.getElementById('prodPlating').value = prod.plating || '';
            document.getElementById('prodCode').value = prod.product_code || '';
            document.getElementById('prodRemarks').value = prod.remarks || '';
        }
    }

    document.getElementById('productModal').classList.remove('hidden');
}
function closeProductModal() {
    document.getElementById('productModal').classList.add('hidden');
    currentProductCustId = null;
    editingProductId = null;
}
async function saveProduct() {
    const spec = document.getElementById('prodSpec').value.trim();
    const price = document.getElementById('prodPrice').value.trim();
    const ourPerf = document.getElementById('prodOurPerf').value;
    if (!spec) { showToast('请填写产品规格', 'error'); return; }
    if (!price) { showToast('请填写单价', 'error'); return; }
    if (!ourPerf) { showToast('请选择我方性能', 'error'); return; }

    const custPerf = document.getElementById('prodCustPerf').value;
    const temp = document.getElementById('prodTemp').value;
    const plating = document.getElementById('prodPlating').value;
    const custCode = document.getElementById('prodCode').value.trim();
    const remarks = document.getElementById('prodRemarks').value.trim();

    // Auto generate product code if empty
    let code = custCode;
    if (!code) {
        const now = Date.now().toString(36).toUpperCase();
        const rand = Math.random().toString(36).substring(2,6).toUpperCase();
        code = `GH${now.slice(-4)}${rand}`;
    }

    try {
        if (editingProductId) {
            await client.db.from('products').update()
                .set({
                    specification: spec,
                    unit_price: parseFloat(price),
                    our_performance: ourPerf,
                    customer_performance: custPerf || null,
                    temperature_rating: temp || null,
                    plating: plating || null,
                    product_code: code,
                    remarks: remarks || null
                })
                .eq('id', editingProductId);
            showToast('产品已更新 ✅');
        } else {
            await client.db.from('products').insert()
                .values({
                    customer_id: currentProductCustId,
                    specification: spec,
                    unit_price: parseFloat(price),
                    our_performance: ourPerf,
                    customer_performance: custPerf || null,
                    temperature_rating: temp || null,
                    plating: plating || null,
                    product_code: code,
                    remarks: remarks || null
                });
            showToast('产品已添加 ✅');
        }
        closeProductModal();
        await loadCustomers();
    } catch(e) { showToast('保存失败: '+e.message, 'error'); }
}

// ====== Confirm Delete ======
function confirmDelete(type, id, label) {
    const msg = type === 'customer' ? `删除客户「${label}」将同时删除其下所有产品` : `删除产品「${label}」`;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmSub').textContent = '此操作不可撤销';
    document.getElementById('confirmModal').classList.remove('hidden');
    confirmCallback = async () => {
        try {
            if (type === 'customer') {
                // Delete products first, then customer
                const cust = customers.find(c => c.id === id);
                if (cust && cust.products) {
                    for (const p of cust.products) {
                        await client.db.from('products').delete().eq('id', p.id);
                    }
                }
                await client.db.from('customers').delete().eq('id', id);
                showToast('客户已删除');
            } else {
                await client.db.from('products').delete().eq('id', id);
                showToast('产品已删除');
            }
            closeConfirm();
            await loadCustomers();
        } catch(e) { showToast('删除失败: '+e.message, 'error'); closeConfirm(); }
    };
}
function closeConfirm() {
    document.getElementById('confirmModal').classList.add('hidden');
    confirmCallback = null;
}
document.getElementById('confirmBtn').addEventListener('click', ()=>{
    if (confirmCallback) confirmCallback();
});

// ====== Populate performance selects ======
function populateSelects() {
    const ourSel = document.getElementById('prodOurPerf');
    const custSel = document.getElementById('prodCustPerf');
    gradeOptions.forEach(g => {
        ourSel.innerHTML += `<option value="${g}">${g}</option>`;
        custSel.innerHTML += `<option value="${g}">${g}</option>`;
    });
}

// ====== Load products for each customer ======
async function loadAllData() {
    try {
        // Load customers
        const custRes = await client.db.from('customers').list().order('id','desc');
        customers = custRes.success ? (custRes.data || []) : [];

        // Load all products
        const prodRes = await client.db.from('products').list().order('id','desc');
        const allProducts = prodRes.success ? (prodRes.data || []) : [];

        // Group products by customer_id
        const prodMap = {};
        allProducts.forEach(p => {
            const cid = p.customer_id;
            if (!prodMap[cid]) prodMap[cid] = [];
            prodMap[cid].push(p);
        });

        customers.forEach(c => {
            c.products = prodMap[c.id] || [];
        });

        renderCustomerList();
    } catch(e) {
        console.error('Load failed:', e);
        customers = [];
        renderCustomerList();
    }
}

// ====== Init ======
populateSelects();
loadAllData();
</script>
