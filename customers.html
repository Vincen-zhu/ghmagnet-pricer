<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>广宏磁铁 · 客户资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#333;padding:12px;max-width:480px;margin:auto;font-size:14px;min-height:100vh;background-size:80px auto;background-repeat:repeat;background-position:0 0}
.logo-header{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 12px}
.logo-header img{height:28px;opacity:0.2}
.logo-header h1{font-size:17px;color:#1a237e;margin:0;display:flex;align-items:center;gap:6px}
.logo-header h1 small{font-size:11px;color:#999;font-weight:400}

.card{background:rgba(255,255,255,.95);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-title{font-size:14px;font-weight:600;color:#1a237e;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.item.full{grid-column:1/-1}
.item label{font-size:11px;color:#888;font-weight:500}
.item input,.item select,.item textarea{border:1px solid #ddd;border-radius:8px;padding:7px 9px;font-size:13px;outline:none;transition:.2s;background:rgba(255,255,255,.9)}
.item input:focus,.item select:focus,.item textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.12)}
.item textarea{resize:vertical;min-height:44px;font-family:inherit}

.btn-row{display:flex;gap:6px;margin-top:6px}
.btn{flex:1;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-danger{background:#d32f2f;color:#fff}
.btn-danger:hover{background:#b71c1c}
.btn-outline{background:transparent;border:1px solid #ddd;color:#666}
.btn-outline:hover{background:#f5f5f5}
.btn-sm{padding:4px 8px;font-size:11px;flex:none}

.cust-item{background:rgba(255,255,255,.93);border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:.2s;border-left:3px solid #1a73e8}
.cust-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.09);transform:translateY(-1px)}
.cust-item .name{font-size:14px;font-weight:600;color:#1a237e;margin-bottom:1px}
.cust-item .phone{font-size:11px;color:#888}
.cust-item .prod-summary{font-size:11px;color:#555;margin-top:4px;line-height:1.5;max-height:60px;overflow:hidden}
.cust-item .time{font-size:10px;color:#bbb;margin-top:3px}
.cust-item .del-btn{float:right;background:none;border:none;color:#ddd;font-size:16px;cursor:pointer;padding:0 3px}
.cust-item .del-btn:hover{color:#d32f2f}
.cust-item .add-prod-btn{background:#e8edf5;border:none;border-radius:4px;padding:2px 8px;font-size:10px;color:#1a73e8;cursor:pointer;margin-top:4px}
.cust-item .add-prod-btn:hover{background:#d0d9ed}

.empty-state{text-align:center;padding:30px 20px;color:#999;font-size:13px;line-height:2}
.search-box{position:relative;margin-bottom:8px}
.search-box input{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;outline:none;background:rgba(255,255,255,.9)}
.search-box input:focus{border-color:#1a73e8}
.search-box .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#bbb;font-size:14px}

/* Product cards */
.prod-list{margin-bottom:6px}
.prod-card{background:#f8faff;border:1px solid #e8edf5;border-radius:10px;margin-bottom:6px;overflow:hidden}
.prod-header{display:flex;align-items:center;gap:4px;padding:7px 10px;cursor:pointer;font-size:13px;transition:.2s;flex-wrap:wrap}
.prod-header:hover{background:#eef3ff}
.prod-header .spec{font-weight:600;color:#1a237e;min-width:50px;font-size:12px}
.prod-header .price{color:#1b5e20;font-weight:500;font-size:11px}
.prod-header .grade{color:#555;font-size:11px}
.prod-header .temp{color:#e65100;font-size:10px;background:#fff3e0;border-radius:4px;padding:1px 5px}
.prod-header .draw-cnt{color:#1a73e8;font-size:10px}
.prod-header .note-cnt{color:#999;font-size:10px}
.prod-header .arrow{color:#bbb;margin-left:auto;font-size:12px;transition:.3s}
.prod-header .arrow.open{transform:rotate(180deg)}
.prod-header .rm-prod{background:none;border:none;color:#d32f2f;cursor:pointer;font-size:14px;padding:0 3px;flex-shrink:0}
.prod-body{padding:8px 10px;border-top:1px solid #e8edf5;display:none;background:#fff}
.prod-body.open{display:block}
.prod-body textarea{width:100%;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:12px;outline:none;resize:vertical;min-height:40px;font-family:inherit}
.prod-body textarea:focus{border-color:#1a73e8}
.prod-body input{border:1px solid #ddd;border-radius:5px;padding:5px;font-size:12px;outline:none}
.prod-body input:focus{border-color:#1a73e8}
.prod-body select{border:1px solid #ddd;border-radius:5px;padding:5px;font-size:12px;outline:none}
.prod-body select:focus{border-color:#1a73e8}

.prod-draws{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.prod-draw-item{position:relative;width:60px;height:60px;border-radius:6px;overflow:hidden;border:1px solid #eee;background:#fafafa}
.prod-draw-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.prod-draw-item .del-draw{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:0 0 0 6px;width:16px;height:16px;font-size:10px;cursor:pointer;line-height:16px;text-align:center;z-index:5}
.prod-draw-add{width:60px;height:60px;border:2px dashed #ccc;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#aaa;font-size:10px;gap:1px;transition:.2s}
.prod-draw-add:hover{border-color:#1a73e8;color:#1a73e8;background:#f0f6ff}
.prod-draw-add .icon{font-size:18px;line-height:1}
input[type=file]{display:none}

.tab-bar{display:flex;background:rgba(255,255,255,.93);border-radius:10px;overflow:hidden;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tab-bar .tab{flex:1;text-align:center;padding:9px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;color:#888;border-bottom:2px solid transparent}
.tab-bar .tab.active{color:#1a73e8;border-bottom-color:#1a73e8;background:#f5f8ff}
.tab-bar .tab:hover{background:#f5f5f5}
.tab-content{display:none}
.tab-content.show{display:block}
.export-area{background:#f5f5f5;border-radius:6px;padding:8px;font-family:monospace;font-size:10px;white-space:pre-wrap;max-height:160px;overflow:auto;margin-top:6px;color:#555}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;border-radius:8px;padding:8px 16px;font-size:12px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.preview-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:pointer}
.preview-overlay img{max-width:92%;max-height:92%;border-radius:6px}
.prod-search{margin-bottom:6px}
.prod-search input{width:100%;border:1px solid #ddd;border-radius:8px;padding:6px 10px;font-size:12px;outline:none;background:rgba(255,255,255,.9)}
.prod-search input:focus{border-color:#1a73e8}
.prod-count{font-size:11px;color:#888;margin-bottom:4px}
.prod-summary-item{display:inline-block;background:#e8edf5;border-radius:4px;padding:1px 6px;font-size:10px;color:#333;margin:1px 2px 1px 0}
</style>
</head>
<body>

<div class="logo-header" id="logoHeader">
  <img id="logoImg" src="" alt="">
  <h1>🧾 客户资料 <small>广宏磁铁</small></h1>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="switchView('list')">📋 列表</div>
  <div class="tab" onclick="switchView('add')">➕ 新增客户</div>
  <div class="tab" onclick="switchView('export')">📤 导出</div>
</div>

<!-- LIST -->
<div id="view-list" class="tab-content show">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜客户名字或电话..." oninput="renderList()">
  </div>
  <div id="customerList"></div>
</div>

<!-- ADD/EDIT -->
<div id="view-add" class="tab-content">
  <div class="card">
    <div class="card-title" id="formTitle">新增客户</div>
    <div class="grid-2">
      <div class="item full"><label>客户名称</label><input type="text" id="fName" placeholder="输入客户名称"></div>
      <div class="item"><label>联系人</label><input type="text" id="fContact" placeholder="联系人姓名"></div>
      <div class="item"><label>电话</label><input type="text" id="fPhone" placeholder="手机号"></div>
      <div class="item"><label>账期 (天)</label><input type="number" id="fPayTerm" step="1" min="0" placeholder="如:30"></div>
      <div class="item"><label>是否含税</label>
        <select id="fTax"><option value="">未设置</option><option value="1">含税</option><option value="0">不含税</option></select>
      </div>
      <div class="item full"><label>地址 / 备注</label><textarea id="fNote" placeholder="公司地址、备注信息等"></textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🧲 产品列表 <span id="prodCount" style="font-size:11px;color:#888"></span></div>
    <div class="prod-search"><input type="text" id="prodSearchInput" placeholder="搜索产品规格..." oninput="renderProducts()"></div>
    <div id="prodContainer" class="prod-list"></div>
    <button onclick="addProduct()" style="background:none;border:1px dashed #1a73e8;color:#1a73e8;border-radius:6px;padding:5px;font-size:12px;cursor:pointer;width:100%;margin-top:4px">+ 添加产品</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="saveCust()">💾 保存</button>
    <button class="btn btn-outline" onclick="switchView('list')">取消</button>
  </div>
</div>

<!-- EXPORT -->
<div id="view-export" class="tab-content">
  <div class="card">
    <div class="card-title">📤 导出 / 导入</div>
    <div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap">
      <button class="btn btn-sm btn-primary" onclick="exportCSV()">📊 复制表格</button>
      <button class="btn btn-sm btn-outline" onclick="exportJSON()">📄 复制 JSON</button>
      <button class="btn btn-sm btn-outline" onclick="clearAll()">🗑️ 清空</button>
    </div>
    <pre id="exportArea" class="export-area">点击按钮导出</pre>
  </div>
  <div class="card">
    <div class="card-title">📥 导入</div>
    <textarea id="importText" style="width:100%;min-height:60px;border:1px solid #ddd;border-radius:8px;padding:6px;font-family:monospace;font-size:11px;outline:none" placeholder="粘贴备份的 JSON 数据..."></textarea>
    <button class="btn btn-primary" onclick="importData()" style="margin-top:4px">导入</button>
  </div>
</div>

<div id="toast" class="toast"></div>

var customers = [];
var editId = null;

function load(){ try{ var d=localStorage.getItem("ghm_cust"); if(d) customers=JSON.parse(d); }catch(e){} if(!Array.isArray(customers)) customers=[]; }
function save(){ localStorage.setItem("ghm_cust",JSON.stringify(customers)); renderList(); }
function idgen(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); },2000); }

function loadLogo(){
  var img=document.getElementById("logoImg");
  if(img && LOGO_B64 && LOGO_B64.indexOf("base64")>0) img.src=LOGO_B64;
  if(LOGO_B64 && LOGO_B64.indexOf("base64")>0){
    document.body.style.backgroundImage="url("+LOGO_B64+")";
  }
}

function switchView(v){
  document.querySelectorAll(".tab-content").forEach(function(t){ t.classList.remove("show"); });
  document.getElementById("view-"+v).classList.add("show");
  document.querySelectorAll(".tab-bar .tab").forEach(function(t){ t.classList.remove("active"); });
  document.querySelectorAll(".tab-bar .tab")[v==="list"?0:v==="add"?1:2].classList.add("active");
  if(v==="list") renderList();
}

/* ===== GRADES / TEMPS HELPERS ===== */
var GRADES = ["","N25","N28","N30","N33","N35-1","N35","N38","N40","N42","N45","N48","N50","N52"];
function gradeOpts(sel){
  var r="";
  GRADES.forEach(function(g){ r+='<option value="'+g+'"'+(sel===g?' selected':'')+'>'+(g||'选择')+'</option>'; });
  return r;
}
function tempOpts(sel){
  var r="";
  ["","80","100","120","150"].forEach(function(t){ r+='<option value="'+t+'"'+(sel===t?' selected':'')+'>'+(t?t+'\u00b0':'选择')+'</option>'; });
  return r;
}

/* ===== PRODUCTS ===== */
function addProduct(pre){
  var sp = (pre&&pre.spec)||"";
  var pr = (pre&&pre.price)||"";
  var ri = (pre&&pre.realGs)||"";
  var rc = (pre&&pre.reportGs)||"";
  var tp = (pre&&pre.temp)||"";
  var nt = (pre&&pre.note)||"";
  var dw = (pre&&pre.draws)||[];
  var idx = Date.now()+Math.random().toString(36).slice(2,6);

  var con = document.getElementById("prodContainer");
  var card = document.createElement("div");
  card.className="prod-card";
  card.dataset.idx=idx;
  card.dataset.spec=sp.toLowerCase();

  var hdr = document.createElement("div");
  hdr.className="prod-header";
  hdr.innerHTML='<span class="spec">'+(sp||"新产品")+'</span><span class="price">'+(pr?"\u00a5"+pr:"")+'</span><span class="grade">'+(ri?ri:"")+(ri&&rc?"/":"")+(rc?rc:"")+'</span><span class="temp">'+(tp?tp+"\u00b0":"")+'</span><span id="dc_'+idx+'" class="draw-cnt">'+(dw.length?"\uD83D\uDCD0 "+dw.length:"")+'</span><span id="nc_'+idx+'" class="note-cnt">'+(nt?"\uD83D\uDCDD":"")+'</span><span class="arrow">\u25BC</span><button class="rm-prod" onclick="event.stopPropagation();delProduct(\''+idx+'\')">\u2715</button>';
  hdr.onclick=function(){toggleProd(this)};
  card.appendChild(hdr);

  var body=document.createElement("div");
  body.className="prod-body";
  body.innerHTML=
    '<div style="display:grid;grid-template-columns:1.5fr 1fr 0.8fr;gap:4px;margin-bottom:6px">'+
    '<div><label style="font-size:10px;color:#888">规格</label><input id="ps_'+idx+'" value="'+sp+'" style="width:100%;padding:5px;font-size:12px" oninput="syncHdr(\''+idx+'\')"></div>'+
    '<div><label style="font-size:10px;color:#888">单价</label><input id="pp_'+idx+'" value="'+pr+'" style="width:100%;padding:5px;font-size:12px" oninput="syncHdr(\''+idx+'\')"></div>'+
    '<div><label style="font-size:10px;color:#888">耐温</label><select id="pt_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+tempOpts(tp)+'</select></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px">'+
    '<div><label style="font-size:10px;color:#888">性能 (内部)</label><select id="pri_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+gradeOpts(ri)+'</select></div>'+
    '<div><label style="font-size:10px;color:#888">性能 (报客户)</label><select id="prc_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+gradeOpts(rc)+'</select></div>'+
    '</div>'+
    '<label style="font-size:10px;color:#888">备注 / 要求</label><textarea id="pn_'+idx+'" placeholder="产品特殊要求、技术参数、包装要求等">'+nt+'</textarea>'+
    '<div class="prod-draws" id="pd_'+idx+'"></div>'+
    '<div style="display:flex;gap:4px;margin-top:4px"><button onclick="pickDraw(\''+idx+'\')" style="background:none;border:1px dashed #1a73e8;color:#1a73e8;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer">+ 添加图纸</button></div>'+
    '<input type="file" accept="image/*" multiple onchange="onDrawPick(event,\''+idx+'\')" style="display:none">';
  card.appendChild(body);
  con.appendChild(card);
  renderDws(idx,dw);
  updateProdCount();
}

function toggleProd(hdr){
  var b=hdr.nextElementSibling;
  var a=hdr.querySelector(".arrow");
  if(b.classList.contains("open")){b.classList.remove("open");a.classList.remove("open")}
  else{b.classList.add("open");a.classList.add("open")}
}

function delProduct(idx){
  var c=document.querySelector('.prod-card[data-idx="'+idx+'"]');
  if(c) c.remove();
  updateProdCount();
}

function syncHdr(idx){
  var c=document.querySelector('.prod-card[data-idx="'+idx+'"]');
  if(!c) return;
  var s=c.querySelector(".spec"); var p=c.querySelector(".price");
  var si=document.getElementById("ps_"+idx); var pi=document.getElementById("pp_"+idx);
  if(s&&si) s.textContent=si.value.trim()||"新产品";
  if(p&&pi) p.textContent=pi.value.trim()?"\u00a5"+pi.value.trim():"";
}

function getProducts(){
  var cards=document.querySelectorAll("#prodContainer .prod-card"); var arr=[];
  cards.forEach(function(c){
    var i=c.dataset.idx;
    var sp=document.getElementById("ps_"+i); var pp=document.getElementById("pp_"+i);
    var ri=document.getElementById("pri_"+i); var rc=document.getElementById("prc_"+i);
    var tp=document.getElementById("pt_"+i); var nt=document.getElementById("pn_"+i);
    var dd=document.getElementById("pd_"+i); var dw=[];
    if(dd){dd.querySelectorAll("img").forEach(function(m){dw.push(m.src)})}
    var s=sp?sp.value.trim():""; if(s) arr.push({spec:s,price:pp?pp.value.trim():"",realGs:ri?ri.value:"",reportGs:rc?rc.value:"",temp:tp?tp.value:"",note:nt?nt.value:"",draws:dw});
  });
  return arr;
}

function updateProdCount(){
  var n=document.querySelectorAll("#prodContainer .prod-card").length;
  document.getElementById("prodCount").textContent=n+" 款";
}

function renderProducts(){
  var q=document.getElementById("prodSearchInput").value.trim().toLowerCase();
  document.querySelectorAll("#prodContainer .prod-card").forEach(function(c){
    var s=(c.dataset.spec||"").toLowerCase();
    c.style.display=(!q||s.indexOf(q)>=0)?"":"none";
  });
}

/* ===== DRAWINGS ===== */
function pickDraw(idx){
  var inp=document.querySelector('.prod-card[data-idx="'+idx+'"] input[type="file"]');
  if(inp) inp.click();
}
function onDrawPick(e,idx){
  var fs=e.target.files; if(!fs||!fs.length) return;
  for(var i=0;i<fs.length;i++){
    var f=fs[i]; if(!f.type.startsWith("image/")) continue;
    (function(file,pidx){
      var r=new FileReader();
      r.onload=function(ev){
        var dd=document.getElementById("pd_"+pidx);
        var it=document.createElement("div");
        it.className="prod-draw-item";
        it.innerHTML='<img src="'+ev.target.result+'" onclick="previewImg(this.src)"><button class="del-draw" onclick="event.stopPropagation();this.parentElement.remove();updateDc(\''+pidx+'\')">X</button>';
        if(dd) dd.appendChild(it);
        updateDc(pidx);
      };
      r.readAsDataURL(file);
    })(f,idx);
  }
  e.target.value="";
}
function updateDc(idx){
  var dd=document.getElementById("pd_"+idx);
  var n=dd?dd.querySelectorAll("img").length:0;
  var el=document.getElementById("dc_"+idx);
  if(el) el.textContent=n?"\uD83D\uDCD0 "+n:"";
}
function renderDws(idx,dws){
  var dd=document.getElementById("pd_"+idx); if(!dd) return;
  dd.innerHTML="";
  dws.forEach(function(s){
    var it=document.createElement("div");
    it.className="prod-draw-item";
    it.innerHTML='<img src="'+s+'" onclick="previewImg(this.src)"><button class="del-draw" onclick="event.stopPropagation();this.parentElement.remove();updateDc(\''+idx+'\')">X</button>';
    dd.appendChild(it);
  });
  updateDc(idx);
}
function previewImg(src){
  var o=document.createElement("div");
  o.className="preview-overlay";
  o.innerHTML='<img src="'+src+'">';
  o.onclick=function(){document.body.removeChild(o)};
  document.body.appendChild(o);
}

/* ===== SAVE ===== */
function saveCust(){
  var nm=document.getElementById("fName").value.trim();
  var ct=document.getElementById("fContact").value.trim();
  var ph=document.getElementById("fPhone").value.trim();
  var nt=document.getElementById("fNote").value.trim();
  var pt=document.getElementById("fPayTerm").value.trim();
  var tx=document.getElementById("fTax").value;
  var pr=getProducts();
  if(!nm&&!ph){toast("请至少填写客户名称或电话");return}
  if(pr.length===0&&!editId){toast("请至少添加一个产品");return}
  var obj={id:editId||idgen(),name:nm,contact:ct,phone:ph,note:nt,payTerm:pt,tax:tx,prods:pr,updated:new Date().toISOString()};
  if(!editId) obj.created=new Date().toISOString();
  if(editId){for(var i=0;i<customers.length;i++){if(customers[i].id===editId){customers[i]=obj;break}}toast("已更新")}
  else{customers.push(obj);toast("已保存")}
  save();editId=null;clearForm();switchView("list");
}

/* ===== QUICK ADD PRODUCT ===== */
function quickAddProd(id){
  // Find the customer and open it for editing, then show the add form tab
  for(var i=0;i<customers.length;i++){
    if(customers[i].id===id){
      editCust(id);
      // After edit opens, add an empty product
      setTimeout(function(){
        addProduct();
        updateProdCount();
        // Expand all products for visibility
        document.querySelectorAll(".prod-header").forEach(function(h){var b=h.nextElementSibling;if(b){b.classList.add("open");h.querySelector(".arrow").classList.add("open")}});
      },100);
      return;
    }
  }
}

function editCust(id){
  for(var i=0;i<customers.length;i++){
    if(customers[i].id===id){
      var c=customers[i];editId=id;
      document.getElementById("formTitle").textContent="编辑客户";
      document.getElementById("fName").value=c.name||"";
      document.getElementById("fContact").value=c.contact||"";
      document.getElementById("fPhone").value=c.phone||"";
      document.getElementById("fNote").value=c.note||"";
      document.getElementById("fPayTerm").value=c.payTerm||"";
      document.getElementById("fTax").value=c.tax||"";
      document.getElementById("prodContainer").innerHTML="";
      if(c.prods&&c.prods.length){c.prods.forEach(function(m){addProduct(m)})}
      updateProdCount();renderProducts();switchView("add");
      return;
    }
  }
}

function delCust(id){
  if(!confirm("确定删除？")) return;
  customers=customers.filter(function(c){return c.id!==id});
  save();toast("已删除");
}

function clearForm(){
  document.getElementById("formTitle").textContent="新增客户";
  ["fName","fContact","fPhone","fNote","fPayTerm"].forEach(function(i){document.getElementById(i).value=""});
  document.getElementById("fTax").value="";
  document.getElementById("prodContainer").innerHTML="";
  document.getElementById("prodCount").textContent="";
  document.getElementById("prodSearchInput").value="";
  editId=null;
}

/* ===== LIST ===== */
function renderList(){
  var q=document.getElementById("searchInput").value.trim().toLowerCase();
  var el=document.getElementById("customerList");
  var arr=customers;
  if(q) arr=customers.filter(function(c){return (c.name||"").toLowerCase().indexOf(q)>=0||(c.phone||"").indexOf(q)>=0||(c.contact||"").toLowerCase().indexOf(q)>=0});
  arr.sort(function(a,b){return (b.updated||"").localeCompare(a.updated||"")});
  if(arr.length===0){
    el.innerHTML='<div class="empty-state">'+(q?"没有匹配的客户":"还没有客户<br><button class=\"btn btn-primary btn-sm\" onclick=\"openAdd()\" style=\"margin-top:8px\">+ 添加第一个</button>")+'</div>';
    return;
  }
  var h="";
  arr.forEach(function(c){
    var ps="";
    if(c.prods&&c.prods.length){
      var tags=[];
      c.prods.slice(0,10).forEach(function(m){
        var t=(m.spec||"?")+(m.price?" ¥"+m.price:"");
        tags.push('<span class="prod-summary-item">'+t+'</span>');
      });
      ps=tags.join("");
      if(c.prods.length>10) ps+='<span class="prod-summary-item" style="background:#fff3e0">+'+(c.prods.length-10)+'</span>';
    }
    var info="";
    if(c.payTerm) info+='<div style="font-size:11px;color:#999;margin-top:2px">\u{1F4C5} 账期: '+c.payTerm+'天</div>';
    if(c.tax) info+='<div style="font-size:11px;color:#999;margin-top:2px">\u{1F4B0} '+(c.tax==="1"?"含税":"不含税")+'</div>';
    var td=0; if(c.prods) c.prods.forEach(function(m){if(m.draws) td+=m.draws.length});
    if(td) info+='<div style="font-size:11px;color:#1a73e8;margin-top:2px">\u{1F4D0} 共 '+td+' 张图纸</div>';
    if(c.note) info+='<div style="font-size:11px;color:#999;margin-top:2px">\u{1F4DD} '+c.note+'</div>';
    var tm=c.updated?new Date(c.updated).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    h+='<div class="cust-item" onclick="editCust(\''+c.id+'\')">';
    h+='<button class="del-btn" onclick="event.stopPropagation();delCust(\''+c.id+'\')">\u2715</button>';
    h+='<div class="name">'+(c.name||"(未命名)")+'</div>';
    h+='<div class="phone">'+(c.phone||c.contact?((c.phone||"")+(c.contact?" \u00b7 "+c.contact:"")).trim():"")+'</div>';
    if(c.prods&&c.prods.length) h+='<div style="font-size:11px;color:#888;margin-top:2px">\uD83E\uDEF2 '+c.prods.length+' 款产品 <button class="add-prod-btn" onclick="event.stopPropagation();quickAddProd(\''+c.id+'\')">+ 添加产品</button></div>';
    if(ps) h+='<div class="prod-summary">'+ps+'</div>';
    h+=info;
    h+='<div class="time">'+tm+'</div>';
    h+='</div>';
  });
  el.innerHTML=h;
}

function openAdd(){
  clearForm();addProduct();updateProdCount();switchView("add");
}

/* ===== EXPORT ===== */
function exportCSV(){
  var rows=[["客户名称","联系人","电话","地址","账期","含税","产品(规格/价格/性能内部/性能报客户/耐温/备注/图纸数)"]];
  customers.forEach(function(c){
    var ps="";
    if(c.prods&&c.prods.length){
      var tags=[];
      c.prods.forEach(function(m){
        var s=m.spec||"";
        if(m.price) s+="/¥"+m.price;
        if(m.realGs) s+="/"+m.realGs;
        if(m.reportGs) s+="/"+m.reportGs;
        if(m.temp) s+="/"+m.temp+"°";
        if(m.note) s+="/备注:"+m.note.replace(/"/g,"'");
        if(m.draws) s+="/图纸:"+m.draws.length+"张";
        tags.push(s);
      });
      ps=tags.join("; ");
    }
    rows.push([c.name||"",c.contact||"",c.phone||"",c.note||"",c.payTerm||"",c.tax||"",ps]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+(v||"").replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  copyText(csv);
  document.getElementById("exportArea").textContent=csv;
  toast("已复制表格格式");
}
function exportJSON(){
  var j=JSON.stringify(customers,null,2);copyText(j);
  document.getElementById("exportArea").textContent=j;toast("已复制 JSON");
}
function importData(){
  var txt=document.getElementById("importText").value.trim();
  if(!txt){toast("请粘贴数据");return}
  try{var d=JSON.parse(txt);if(!Array.isArray(d))throw"格式错误";
    if(customers.length>0&&!confirm("已有 "+customers.length+" 条，导入将合并，确定？"))return;
    d.forEach(function(x){var f=false;for(var i=0;i<customers.length;i++){if(customers[i].id===x.id){customers[i]=x;f=true;break}}if(!f)customers.push(x)});
    save();document.getElementById("importText").value="";toast("导入 "+d.length+" 条");switchView("list");
  }catch(e){toast("格式错误")}
}
function clearAll(){if(!confirm("确定清空所有？不可恢复！"))return;customers=[];save();toast("已清空")}
function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t);return}var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta)}

/* FLOATING */
(function(){
  var b=document.createElement("div");
  b.style.cssText="position:fixed;bottom:16px;right:16px;width:44px;height:44px;background:#1a73e8;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 10px rgba(26,115,232,.4);cursor:pointer;z-index:50";
  b.textContent="+";b.onclick=openAdd;document.body.appendChild(b);
})();

load();renderList();loadLogo();
</script>
