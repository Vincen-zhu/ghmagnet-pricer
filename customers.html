dding:1px 5px}.prod-header .grade{color:var(--text2);font-size:11px}.prod-header .temp{color:var(--accent);font-size:10px;background:#fff7ed;border-radius:4px;padding:1px 5px}.prod-header .arrow{color:var(--text3);margin-left:auto;font-size:14px;transition:.3s;flex-shrink:0}.prod-header .arrow.open{transform:rotate(180deg)}.prod-header .rm-prod{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;flex-shrink:0;opacity:0;transition:.15s}.prod-card:hover .rm-prod{opacity:1}.prod-header .rm-prod:hover{background:#fef2f2;color:var(--danger)}.prod-body{padding:12px;border-top:1.5px solid var(--border);display:none;background:#fff}.prod-body.open{display:block}.prod-body label{font-size:10px;color:var(--text2);font-weight:500;display:block;margin-bottom:2px}.prod-body textarea{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;outline:none;resize:vertical;min-height:36px;font-family:inherit;transition:.15s;color:var(--text)}.prod-body textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,86,219,.08)}.prod-body input,.prod-body select{border:1.5px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;transition:.15s;width:100%;color:var(--text);background:var(--card)}.prod-body input:focus,.prod-body select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,86,219,.08)}.prod-draws{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prod-draw-item{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);background:#f8fafc}.prod-draw-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}.prod-draw-item .del-draw{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:4px;width:16px;height:16px;font-size:9px;cursor:pointer;line-height:16px;text-align:center;z-index:5}.prod-search{margin-bottom:8px}.prod-search input{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px;outline:none;background:var(--card);transition:.15s;color:var(--text)}.prod-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,86,219,.08)}.prod-count{font-size:12px;color:var(--text2);margin-bottom:6px}.export-area{background:#f8fafc;border-radius:8px;padding:10px;font-family:monospace;font-size:10px;white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:8px;color:var(--text2);border:1.5px solid var(--border)}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;color:#fff;border-radius:10px;padding:8px 16px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow-lg)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.preview-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:pointer}.preview-overlay img{max-width:92%;max-height:92%;border-radius:12px}.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;line-height:2}.fab{position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--primary);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(26,86,219,.35);cursor:pointer;border:none;transition:.2s;z-index:50}.fab:active{transform:scale(.9)}.add-prod-btn{background:none;border:1.5px dashed var(--border);color:var(--text2);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;width:100%;margin-top:4px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}.add-prod-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}.prod-draw-add{width:56px;height:56px;border:2px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:10px;gap:1px;transition:.15s}.prod-draw-add:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}.prod-draw-add .icon{font-size:16px;line-height:1}input[type=file]{display:none}
</style><script>
const CUST_BASE_URL='https://baas.kuafuai.net/baas-api';const CUST_API_KEY='baas_1BQP4GLQ';const CUST_TABLE='table_customers_v2';const PROD_TABLE='table_products';var allProducts=[];var customers=[];var editId=null;var _loadMergeTimer=null;</script></head><body>
<div class="app-header"><div class="logo"><h1>客户资料 <span>广宏磁铁</span></h1></div><div class="header-actions"><button onclick="switchView('export')">📤</button></div></div>
<div class="tab-bar"><div class="tab active" onclick="switchView('list')">📋 列表</div><div class="tab" onclick="switchView('add')">➕ 新增客户</div><div class="tab" onclick="switchView('export')">📤 导出</div></div>
<div id="view-list" class="tab-content show"><div class="search-box"><span class="icon">🔍</span><input type="text" id="searchInput" placeholder="搜客户名字或电话..." oninput="renderList()"></div><div id="customerList"></div></div>
<div id="view-add" class="tab-content"><div class="card"><div class="card-title"><span id="formTitle">新增客户</span></div><div class="grid-2"><div class="item"><label>客户名称</label><input id="fName" placeholder="输入客户名称"></div><div class="item"><label>联系人</label><input id="fContact" placeholder="联系人姓名"></div><div class="item"><label>电话</label><input id="fPhone" placeholder="手机号"></div><div class="item"><label>账期 (天)</label><input id="fPayTerm" placeholder="如: 30天"></div><div class="item"><label>是否含税</label><select id="fTax"><option value="">未设置</option><option value="含税">含税</option><option value="不含税">不含税</option></select></div><div class="item full"><label>地址 / 备注</label><textarea id="fNote" placeholder="公司地址、备注信息等"></textarea></div></div></div>
<div class="card"><div class="card-title"><span>🧲 产品列表</span><span id="prodCount" class="prod-count">0 款</span></div><div class="prod-search"><input type="text" id="prodSearch" placeholder="搜索产品规格..." oninput="renderProducts()"></div><div id="prodContainer" class="prod-list"></div><button class="add-prod-btn" onclick="addProduct()">+ 添加产品</button></div>
<div class="btn-row"><button class="btn btn-primary" onclick="saveCust()">💾 保存</button><button class="btn btn-outline" onclick="clearEdit()">取消</button></div></div>
<div id="view-export" class="tab-content"><div class="card"><div class="card-title">📤 导出 / 导入</div><div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap"><button class="btn btn-sm btn-primary" onclick="exportCSV()">📊 复制表格</button><button class="btn btn-sm btn-outline" onclick="exportJSON()">📄 复制 JSON</button><button class="btn btn-sm btn-outline" onclick="clearAll()">🗑️ 清空</button></div><pre id="exportArea" class="export-area">点击按钮导出</pre></div><div class="card"><div class="card-title">📥 导入</div><textarea id="importText" style="width:100%;min-height:60px;border:1.5px solid var(--border);border-radius:8px;padding:6px;font-family:monospace;font-size:11px;outline:none" placeholder="粘贴备份的 JSON 数据..."></textarea><button class="btn btn-primary" onclick="importData()" style="margin-top:4px">导入</button></div></div>
<div id="toast" class="toast"></div>
<script>
/* ===== CLOUD ===== */
function ensureCustClient(){if(!window._custClient){if(typeof aipexbase==='undefined')return null;window._custClient=aipexbase.createClient({baseUrl:CUST_BASE_URL,apiKey:CUST_API_KEY})}return window._custClient}
async function loadCustomersFromCloud(){try{var c=ensureCustClient();if(!c)return;var res=await c.db.from(CUST_TABLE).list();if(res.success&&res.data&&res.data.length){var cloudMap={};res.data.forEach(function(row){var id=row.cust_id||'';if(!id)return;var obj={id:id,name:row.cust_name||'',contact:row.cust_contact||'',phone:row.cust_phone||'',note:row.cust_remark||'',payTerm:row.cust_payterm||'',tax:row.cust_tax||''};var r=row.cust_remark||'';var sepIdx=r.indexOf('\\n---prods---\\n');if(sepIdx>=0){obj.note=r.substring(0,sepIdx);try{obj.prods=JSON.parse(r.substring(sepIdx+14))}catch(e2){obj.prods=[]}}else{obj.prods=[]}cloudMap[id]=obj});customers.forEach(function(lc){if(!lc||!lc.id)return;if(cloudMap[lc.id]){if(lc.prods&&lc.prods.length)cloudMap[lc.id].prods=lc.prods;if(lc.payTerm)cloudMap[lc.id].payTerm=lc.payTerm;if(lc.tax)cloudMap[lc.id].tax=lc.tax;if(lc.note)cloudMap[lc.id].note=lc.note}else{cloudMap[lc.id]=lc}});customers=Object.values(cloudMap)}}catch(e){console.error('Failed loading customers',e)}try{localStorage.setItem('ghm_cust',JSON.stringify(customers))}catch(e){}renderList()}
async function syncCustomersToCloud(){try{var c=ensureCustClient();if(!c)return;var old=await c.db.from(CUST_TABLE).list();if(old.success&&old.data){for(var i=0;i<old.data.length;i++){await c.db.from(CUST_TABLE).delete().eq('id',old.data[i].id)}}for(var i=0;i<customers.length;i++){var row=customers[i];var remark=(row.note||'')+'\\n---prods---\\n'+JSON.stringify(row.prods||[]);await c.db.from(CUST_TABLE).insert().values({cust_id:String(row.id||''),cust_name:String(row.name||''),cust_contact:String(row.contact||''),cust_phone:String(row.phone||''),cust_remark:remark})}}catch(e){console.error('Failed syncing customers',e)}}
async function loadProductsFromCloud(){try{var c=ensureCustClient();if(!c)return;var res=await c.db.from(PROD_TABLE).list();if(res.success&&res.data){allProducts=res.data.map(function(row){return{cust_name:row.cust_name||'',phone:row.cust_phone||'',product:row.product_name||'',spec:row.spec||'',material:row.material||'',coating:row.coating||'',price:row.unit_price||'',price_type:row.price_type||'',gauss:row.gauss||'',remark:row.remark||''}})}}catch(e){console.error('Failed loading products',e)}if(typeof renderList==='function')renderList()}
function getProductsByName(name){if(!name||!allProducts.length)return[];return allProducts.filter(function(p){return p.cust_name===name||p.phone===name})}
/* ===== DATA LIFECYCLE ===== */
function load(){try{var d=localStorage.getItem("ghm_cust");if(d)customers=JSON.parse(d)}catch(e){}if(!Array.isArray(customers))customers=[];loadCustomersFromCloud();loadProductsFromCloud()}
function save(){localStorage.setItem("ghm_cust",JSON.stringify(customers));syncCustomersToCloud();renderList()}
function idgen(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
function switchView(v){document.querySelectorAll(".tab-content").forEach(function(t){t.classList.remove("show")});document.getElementById("view-"+v).classList.add("show");document.querySelectorAll(".tab-bar .tab").forEach(function(t){t.classList.remove("active")});document.querySelectorAll(".tab-bar .tab")[v==="list"?0:v==="add"?1:2].classList.add("active");if(v==="list")renderList()}
function clearEdit(){editId=null;clearForm();switchView("list")}
function clearForm(){document.getElementById("formTitle").textContent="新增客户";["fName","fContact","fPhone","fNote","fPayTerm"].forEach(function(i){document.getElementById(i).value=""});document.getElementById("fTax").value="";document.getElementById("prodContainer").innerHTML="";document.getElementById("prodCount").textContent="0 款"}
/* ===== PRODUCTS ===== */
function addProduct(pre){var sp=(pre&&pre.spec)||"";var qty=(pre&&pre.quantity)||"";var pr=(pre&&pre.price)||"";var mc=(pre&&pre.materialCode)||"";var ri=(pre&&pre.realGs)||"";var rc=(pre&&pre.reportGs)||"";var tp=(pre&&pre.temp)||"";var nt=(pre&&pre.note)||"";var dw=(pre&&pre.draws)||[];var idx=Date.now()+Math.random().toString(36).slice(2,6);var con=document.getElementById("prodContainer");var card=document.createElement("div");card.className="prod-card";card.dataset.idx=idx;card.dataset.spec=sp.toLowerCase();var hdr=document.createElement("div");hdr.className="prod-header";hdr.innerHTML='<span class="spec">'+(sp||"新产品")+'</span><span class="price">'+(pr?"¥"+pr:"")+'</span><span class="grade">'+(ri?ri:"")+(ri&&rc?"/":"")+(rc?rc:"")+'</span><span class="temp">'+(tp?tp+"°":"")+'</span><span class="arrow open">▼</span><button class="rm-prod" onclick="event.stopPropagation();delProduct(\''+idx+'\')">✕</button>';hdr.onclick=function(){toggleProd(this)};card.appendChild(hdr);var body=document.createElement("div");body.className="prod-body open";body.innerHTML='<div style="display:grid;grid-template-columns:1.5fr 1fr 0.8fr;gap:4px;margin-bottom:6px">'+'<div><label>规格</label><input id="ps_'+idx+'" value="'+sp+'" style="width:100%;padding:5px;font-size:12px" oninput="syncHdr(\''+idx+'\')"></div>'+'<div><label>数量</label><input id="pq_'+idx+'" value="'+qty+'" type="number" min="0" style="width:100%;padding:5px;font-size:12px"></div>'+'<div><label>单价</label><input id="pp_'+idx+'" value="'+pr+'" style="width:100%;padding:5px;font-size:12px" oninput="syncHdr(\''+idx+'\')"></div>'+'</div>'+'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:6px">'+'<div><label>物料代码</label><input id="pmc_'+idx+'" value="'+mc+'" style="width:100%;padding:5px;font-size:12px"></div>'+'<div><label>性能 (内部)</label><select id="pri_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+gradeOpts(ri)+'</select></div>'+'<div><label>性能 (报客户)</label><select id="prc_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+gradeOpts(rc)+'</select></div>'+'</div>'+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px">'+'<div><label>耐温</label><select id="pt_'+idx+'" style="width:100%;padding:5px;font-size:12px">'+tempOpts(tp)+'</select></div>'+'<div></div>'+'</div>'+'<label>备注 / 要求</label><textarea id="pn_'+idx+'" placeholder="产品规格、技术要求、包装要求等">'+nt+'</textarea>'+'<div class="prod-draws" id="pd_'+idx+'"></div>'+'<div style="display:flex;gap:4px;margin-top:4px"><button onclick="pickDraw(\''+idx+'\')" style="background:none;border:1px dashed #1a73e8;color:#1a73e8;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer">+ 添加图纸</button></div>'+'<input type="file" accept="image/*" multiple onchange="onDrawPick(event,\''+idx+'\')" style="display:none">';card.appendChild(body);con.appendChild(card);renderDws(idx,dw);updateProdCount()}
function toggleProd(hdr){var b=hdr.nextElementSibling;var a=hdr.querySelector(".arrow");if(b.classList.contains("open")){b.classList.remove("open");a.classList.remove("open")}else{b.classList.add("open");a.classList.add("open")}}
function delProduct(idx){var c=document.querySelector('.prod-card[data-idx="'+idx+'"]');if(c)c.remove();updateProdCount()}
function syncHdr(idx){var c=document.querySelector('.prod-card[data-idx="'+idx+'"]');if(!c)return;var s=c.querySelector(".spec");var p=c.querySelector(".price");var si=document.getElementById("ps_"+idx);var pi=document.getElementById("pp_"+idx);if(s&&si)s.textContent=si.value.trim()||"新产品";if(p&&pi)p.textContent=pi.value.trim()?"¥"+pi.value.trim():""}
function gradeOpts(v){var g=["N25","N28","N30","N33","N35-1","N35","N38","N40","N42","N45","N48","N50","N52"];var s="";g.forEach(function(x){s+='<option value="'+x+'"'+(v===x?' selected':'')+'>'+x+"</option>"});return'<option value="">选择</option>'+s}
function tempOpts(v){var t=["80°","100°","120°","150°","180°","200°","250°"];var s="";t.forEach(function(x){s+='<option value="'+x+'"'+(v===x?' selected':'')+'>'+x+"</option>"});return'<option value="">不要求</option>'+s}
function getProducts(){var cards=document.querySelectorAll("#prodContainer .prod-card");var arr=[];cards.forEach(function(c){var i=c.dataset.idx;var sp=document.getElementById("ps_"+i);var pq=document.getElementById("pq_"+i);var pp=document.getElementById("pp_"+i);var pmc=document.getElementById("pmc_"+i);var ri=document.getElementById("pri_"+i);var rc=document.getElementById("prc_"+i);var tp=document.getElementById("pt_"+i);var nt=document.getElementById("pn_"+i);var dd=document.getElementById("pd_"+i);var dw=[];if(dd){dd.querySelectorAll("img").forEach(function(m){dw.push(m.src)})}var s=sp?sp.value.trim():"";if(s)arr.push({spec:s,quantity:pq?pq.value.trim():"",price:pp?pp.value.trim():"",materialCode:pmc?pmc.value.trim():"",realGs:ri?ri.value:"",reportGs:rc?rc.value:"",temp:tp?tp.value:"",note:nt?nt.value:"",draws:dw})});return arr}
function updateProdCount(){var n=document.querySelectorAll("#prodContainer .prod-card").length;document.getElementById("prodCount").textContent=n+" 款"}
function renderProducts(){document.querySelectorAll("#prodContainer .prod-card").forEach(function(c){var s=c.dataset.spec;var q=document.getElementById("prodSearch").value.trim().toLowerCase();c.style.display=(!q||s.indexOf(q)>=0)?"":"none"})}
function pickDraw(idx){var inp=document.querySelector('input[type="file"][onchange*="'+idx+'"]');if(inp)inp.click()}
function onDrawPick(e,idx){Array.from(e.target.files).forEach(function(f){(function(f2,i){var r=new FileReader();r.onload=function(ev){var dd=document.getElementById("pd_"+i);if(!dd)return;var it=document.createElement("div");it.className="prod-draw-item";it.innerHTML='<img src="'+ev.target.result+'" onclick="previewImg(this.src)"><button class="del-draw" onclick="event.stopPropagation();this.parentElement.remove();updateDc(\''+i+'\')">X</button>';dd.appendChild(it);updateDc(i)};r.readAsDataURL(f2)})(f,idx)});e.target.value=""}
function updateDc(idx){var dd=document.getElementById("pd_"+idx);var n=dd?dd.querySelectorAll("img").length:0;var el=document.getElementById("dc_"+idx);if(el)el.textContent=n?"📐 "+n:""}
function renderDws(idx,dws){var dd=document.getElementById("pd_"+idx);if(!dd)return;dd.innerHTML="";dws.forEach(function(s){var it=document.createElement("div");it.className="prod-draw-item";it.innerHTML='<img src="'+s+'" onclick="previewImg(this.src)"><button class="del-draw" onclick="event.stopPropagation();this.parentElement.remove();updateDc(\''+idx+'\')">X</button>';dd.appendChild(it)});updateDc(idx)}
function previewImg(src){var o=document.createElement("div");o.className="preview-overlay";o.innerHTML='<img src="'+src+'">';o.onclick=function(){document.body.removeChild(o)};document.body.appendChild(o)}
/* ===== SAVE ===== */
function saveCust(){var nm=document.getElementById("fName").value.trim();var ct=document.getElementById("fContact").value.trim();var ph=document.getElementById("fPhone").value.trim();var nt=document.getElementById("fNote").value.trim();var pt=document.getElementById("fPayTerm").value.trim();var tx=document.getElementById("fTax").value;var pr=getProducts();if(!nm&&!ph){toast("请至少填写客户名称或电话");return}if(pr.length===0&&!editId){toast("请至少添加一个产品");return}var obj={id:editId||idgen(),name:nm,contact:ct,phone:ph,note:nt,payTerm:pt,tax:tx,prods:pr,updated:new Date().toISOString()};if(!editId)obj.created=new Date().toISOString();if(editId){for(var i=0;i<customers.length;i++){if(customers[i].id===editId){customers[i]=obj;customers[i].updated=new Date().toISOString();break}}toast("已更新")}else{customers.push(obj);toast("已保存")}save();editId=null;clearForm();switchView("list")}
function editCust(id){for(var i=0;i<customers.length;i++){if(customers[i].id===id){var c=customers[i];editId=id;if(!c.prods||!c.prods.length){var cp=getProductsByName(c.name||'');if(cp&&cp.length){c.prods=cp.map(function(p){return{spec:p.spec||'',price:p.price||'',realGs:p.material||p.gauss||'',reportGs:p.gauss||'',temp:'',note:(p.coating||'')+(p.remark?' | '+p.remark:''),draws:[]}})}}document.getElementById("formTitle").textContent="编辑客户";document.getElementById("fName").value=c.name||"";document.getElementById("fContact").value=c.contact||"";document.getElementById("fPhone").value=c.phone||"";document.getElementById("fNote").value=c.note||"";document.getElementById("fPayTerm").value=c.payTerm||"";document.getElementById("fTax").value=c.tax||"";document.getElementById("prodContainer").innerHTML="";if(c.prods&&c.prods.length){c.prods.forEach(function(m){addProduct(m)})}updateProdCount();renderProducts();switchView("add");return}}
document.getElementById("toast")
function delCust(id){if(!confirm("确定删除？"))return;customers=customers.filter(function(c){return c.id!==id});save();toast("已删除")}
function mergeCloudProds(){customers.forEach(function(c){if(!c.prods||!c.prods.length){var cp=getProductsByName(c.name||'');if(cp&&cp.length){c.prods=cp.map(function(p){return{spec:p.spec||'',price:p.price||'',realGs:p.material||p.gauss||'',reportGs:p.gauss||'',temp:'',note:(p.coating||'')+(p.remark?' | '+p.remark:''),draws:[]}})}}})}
function clearAll(){if(!confirm("确定清空所有？不可恢复！"))return;customers=[];save();toast("已清空")}
function exportJSON(){var ta=document.getElementById("exportArea");ta.textContent=JSON.stringify(customers,null,2);copyText(ta.textContent);toast("已复制 JSON")}
function exportCSV(){var rows=[["客户名称","联系人","电话","地址","账期","含税","产品(规格/数量/物料代码/单价/性能内部/性能报客户/耐温/备注/图纸数)"]];customers.forEach(function(c){var ps="";if(c.prods&&c.prods.length){var tags=[];c.prods.forEach(function(m){var s=m.spec||"";if(m.quantity)s+="/x"+m.quantity;if(m.materialCode)s+="/物料:"+m.materialCode;if(m.price)s+="/¥"+m.price;if(m.realGs)s+="/"+m.realGs;if(m.reportGs)s+="/"+m.reportGs;if(m.temp)s+="/"+m.temp+"°";if(m.note)s+="/备注:"+m.note.replace(/"/g,"'");if(m.draws)s+="/图纸:"+m.draws.length+"张";tags.push(s)});ps=tags.join("; ")}rows.push([c.name||"",c.contact||"",c.phone||"",c.note||"",c.payTerm||"",c.tax||"",ps])});var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\\n");document.getElementById("exportArea").textContent=csv;copyText(csv);toast("已复制表格")}
function importData(){try{var d=JSON.parse(document.getElementById("importText").value.trim());if(!Array.isArray(d)){toast("格式错误");return}d.forEach(function(x){if(!x.id)x.id=idgen();var f=false;for(var i=0;i<customers.length;i++){if(customers[i].id===x.id){customers[i]=x;f=true;break}}if(!f)customers.push(x)});save();document.getElementById("importText").value="";toast("导入 "+d.length+" 条");switchView("list")}catch(e){toast("格式错误")}}
function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t);return}var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta)}
function renderList(){var q=document.getElementById("searchInput").value.trim().toLowerCase();var el=document.getElementById("customerList");if(!customers.length){el.innerHTML='<div class="empty-state">暂无客户数据<br>点击右下角 + 添加客户</div>';return}var html="";customers.forEach(function(c){var nm=c.name||"?";if(q&&nm.toLowerCase().indexOf(q)<0&&(c.phone||"").indexOf(q)<0)return;var ps="";if(c.prods&&c.prods.length){var tags=[];c.prods.slice(0,50).forEach(function(m){var t=(m.spec||"?")+(m.quantity?" x"+m.quantity:"")+(m.price?" ¥"+m.price:"")+(m.materialCode?" | 物料:"+m.materialCode:"")+(m.realGs?" | 性能:"+m.realGs:"")+(m.note?" | "+m.note.replace(/.{30}(?=.)/g,"$&..."):"");tags.push('<span class="prod-summary-item">'+t+'</span>')});ps=tags.join("")}html+='<div class="cust-item" onclick="editCust(\''+c.id+'\')"><div class="name">'+nm+'</div><div class="phone">📞 '+(c.contact?c.contact+ ' · ':'')+(c.phone||"")+'</div><div class="meta-tags">'+(c.payTerm?'<span class="tag">⏱ '+c.payTerm+"天</span>":"")+(c.tax?'<span class="tag">💰 '+c.tax+"</span>":"")+'</div>'+(ps?'<div class="prod-summary">'+ps+"</div>":"")+'<div class="time">'+((c.updated||"").slice(0,10)||"")+'</div><button class="del-btn" onclick="event.stopPropagation();delCust(\''+c.id+'\')">✕</button></div>'});el.innerHTML=html}
/* ===== INIT ===== */
(function(){var b=document.createElement("div");b.className="fab";b.textContent="+";b.onclick=function(){clearForm();switchView("add")};document.body.appendChild(b)})();load();document.getElementById("fPhone").addEventListener("blur",function(){var nm=document.getElementById("fName").value.trim();var ph=this.value.trim();if(!nm&&ph){this.value=ph.replace(/\\s+/g,"")}})
</script></body></html>
